name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Unit tests; the harness runs in `harness`.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --bin paddock --locked

  # The app-level harness, on paddock's own server.
  harness:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Harness
        run: scripts/test-native.sh --locked --no-fail-fast

  # Linux (ticket 52): the unit tests and the harness.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # zsh is the harness's shell.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Unit tests
        run: cargo test --bin paddock --locked
      - name: Harness
        run: scripts/test-native.sh --locked --no-fail-fast

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: paddock-macos-arm64
          path: target/release/paddock
