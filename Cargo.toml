[package]
name = "paddock"
version = "0.1.0-rc.2"
edition = "2021"
rust-version = "1.85"
description = "A terminal workspace for running Claude Code"
license = "MIT"
repository = "https://github.com/MiohitoKiri5474/paddock"
publish = false

[[bin]]
name = "paddock"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
# alacritty_terminal 0.26 plus the VS16 emoji width fix (ADR 0005). The library
# name is still `alacritty_terminal`; pinned exactly until the fix is upstream.
alacritty_terminal = { package = "yas-alacritty-terminal", version = "=0.26.0-yas.1" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# The copy tool's stderr goes to a file: a pipe would be held open by the
# child `xclip` and `wl-copy` leave behind.
tempfile = "3"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.18"
