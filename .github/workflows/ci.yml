name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    # ponytail: macOS only, paddock is a Mac-only tool.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Some unit tests drive a real tmux server.
      - name: Install tmux
        run: brew install tmux
      - name: Unit tests
        run: cargo test --bin paddock --locked

  # The app-level harness on the native backend (experimental, ticket 40):
  # tests marked native_needs_4N wait for tickets 41-43.
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The harness still ends a sandbox's tmux server when dropped.
      - name: Install tmux
        run: brew install tmux
      - name: Harness on the native backend
        env:
          PADDOCK_TEST_BACKEND: native
        run: cargo test --locked --tests -- --skip tmux_only --skip native_needs

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: paddock-macos-arm64
          path: target/release/paddock
